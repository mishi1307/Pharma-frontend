<header class="topbar">
  <div class="left">
    <button type="button" aria-label="Mostrar u ocultar menú" (click)="toggleMenu.emit()">☰</button>
    <a class="brand" routerLink="/inicio"><span class="mark">P</span><span><strong>PharmaSoft</strong><small>Gestión farmacéutica</small></span></a>
  </div>
  <nav class="top-nav" aria-label="Menú superior"><a routerLink="/inicio">Inicio</a><a href="http://localhost:8080/swagger-ui.html" target="_blank" rel="noopener">API</a></nav>
  @if (sesion(); as user) {
    <div class="account">
      <div class="account-heading"><span class="account-name">{{ user.nombreCompleto }}</span><a class="account-link" routerLink="/mi-cuenta">Mi cuenta</a></div>
      <small>{{ roles() }} · Vence {{ user.expiraEn | date:'HH:mm' }}</small>
    </div>
    <button class="logout" type="button" (click)="salir()">Cerrar sesión</button>
  }
</header>
